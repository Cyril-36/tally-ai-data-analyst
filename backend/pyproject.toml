[project]
name = "analyst"
version = "0.1.0"
description = "AI data analyst: ask questions about CSV files in natural language"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=18",
    "numpy>=2.1",
    "sqlglot>=25",
    "argon2-cffi>=23.1",
    "openai>=1.55",
    "plotly>=5.24",
]

[project.scripts]
app = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "httpx>=0.27",
    "ruff>=0.7",
    "vulture>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
